name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify OKX signing client is unmodified
        run: |
          expected=b7038d6e4776f02bce185620e96f7b868e5d7452
          actual=$(git hash-object okx_openapi_client.py)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
      - name: Run tests (offline)
        run: python -m unittest -v test_guard.py
      - name: CLI smoke test
        run: |
          python cli.py --help
          python smoke_demo.py --help
          python cli.py halt && python cli.py resume && python cli.py log
